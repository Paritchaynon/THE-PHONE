services:
  - type: web
    name: between-us-server
    env: node
    plan: free
    rootDir: packages/server
    buildCommand: npm install && npm run build --workspace=@between-us/shared && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: between-us-client
    env: static
    rootDir: packages/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: between-us-server
          property: host
